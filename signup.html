<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up · Stationly</title>
  <link rel="stylesheet" href="auth.css">
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <meta name="description" content="Start your 30-day Stationly trial. No card required." />
  <meta name="theme-color" content="#faf5ea" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1c1a15" media="(prefers-color-scheme: dark)" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Stationly" />
  <meta name="mobile-web-app-capable" content="yes" />
  <script src="/pwa.js" defer></script>
  <script src="https://browser.sentry-cdn.com/8.39.0/bundle.tracing.min.js" crossorigin="anonymous" defer></script>
  <script src="/sentry-init.js" defer></script>
  <style>
    /* Local additions for the magic-link toggle */
    .auth-toggle {
      display:flex; gap:0; margin: 4px 0 20px;
      border:1px solid rgba(255,255,255,.1); border-radius:10px; overflow:hidden;
      background: rgba(255,255,255,.02);
    }
    .auth-toggle button {
      flex:1; padding:11px 12px; border:0; background:transparent; cursor:pointer;
      font: inherit; color: rgba(244,236,216,.65); font-weight:600; font-size:14px;
      transition: background .15s ease, color .15s ease;
    }
    .auth-toggle button[aria-pressed="true"] {
      background: rgba(232,163,61,.12); color: var(--accent, #E8A33D);
      box-shadow: inset 0 -2px 0 var(--accent, #E8A33D);
    }
    .auth-toggle button:hover:not([aria-pressed="true"]) { background: rgba(255,255,255,.04); color: var(--text, #f4ecd8); }
    .pane { display:none; }
    .pane.active { display:block; }
    .pw-row { display:flex; gap:8px; align-items:flex-start; }
    .pw-row > label { flex:1; }
    .magic-success {
      padding: 18px; border-radius: 10px;
      background: rgba(80, 160, 100, .1); border: 1px solid rgba(80, 160, 100, .28);
      color: #b8e0c4; line-height: 1.5;
    }
    .magic-success strong { display:block; margin-bottom:6px; font-size:16px; color: #d4f0d8; }
    .field-hint.muted { opacity:.6 }
  </style>
</head>
<body class="auth-body">
  <main class="auth-shell">
    <header class="auth-head">
      <a href="./app.html" class="brand">
        <svg width="32" height="32" viewBox="0 0 64 64" fill="none" aria-label="Stationly">
          <rect width="64" height="64" rx="14" fill="#e8a33d"/>
          <path d="M20 22 Q20 14 32 14 Q44 14 44 22 L44 24 Q44 28 36 28 L28 28 Q20 28 20 34 Q20 40 28 40 L36 40 Q44 40 44 44 L44 46 Q44 54 32 54 Q20 54 20 46" stroke="#1c1a15" stroke-width="5" stroke-linecap="round" fill="none"/>
        </svg>
        <span>Stationly</span>
      </a>
    </header>

    <section class="auth-card">
      <h1>Start your 30-day trial</h1>
      <p class="auth-sub">No card required. Cancel anytime.</p>

      <div class="auth-toggle" role="tablist" aria-label="Signup method">
        <button type="button" id="tab-magic" role="tab" aria-pressed="true" aria-controls="pane-magic">Email me a link</button>
        <button type="button" id="tab-password" role="tab" aria-pressed="false" aria-controls="pane-password">Use a password</button>
      </div>

      <!-- Magic link pane (default) -->
      <div class="pane active" id="pane-magic">
        <form id="magic-form" class="auth-form" autocomplete="on" novalidate>
          <label>
            <span>Your name <span class="field-hint muted">(optional)</span></span>
            <input type="text" name="fullName" autocomplete="name" placeholder="Anthony Rossi">
          </label>
          <label>
            <span>Email</span>
            <input type="email" name="email" id="magic-email" required autocomplete="email" placeholder="you@restaurant.com">
            <small class="field-hint muted">We'll send you a one-tap sign-in link. No password to remember.</small>
          </label>
          <label class="auth-check">
            <input type="checkbox" name="agree" checked required>
            <span>I agree to the <a href="./legal/terms.html" target="_blank" rel="noopener">Terms</a> and <a href="./legal/privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.</span>
          </label>
          <div id="magic-error" class="auth-error" hidden></div>
          <button type="submit" class="btn-primary" id="magic-btn">Email me a sign-in link</button>
        </form>

        <div id="magic-sent" class="magic-success" hidden>
          <strong>Check your email.</strong>
          We just sent a sign-in link to <span id="magic-sent-email"></span>. Click the link from the same browser to finish signing up. The link expires in 1 hour.
        </div>
      </div>

      <!-- Password pane (fallback) -->
      <div class="pane" id="pane-password">
        <form id="signup-form" class="auth-form" autocomplete="on">
          <label>
            <span>Your name <span class="field-hint muted">(optional)</span></span>
            <input type="text" name="fullName" autocomplete="name" placeholder="Anthony Rossi">
          </label>
          <label>
            <span>Email</span>
            <input type="email" name="email" id="signup-email" required autocomplete="email" placeholder="you@restaurant.com">
          </label>
          <label>
            <span>Password</span>
            <input type="password" name="password" id="signup-password" required autocomplete="new-password" minlength="8" placeholder="at least 8 characters">
            <div class="pw-meter" id="pw-meter" hidden>
              <div class="pw-meter-bar"><span id="pw-meter-fill"></span></div>
              <small id="pw-hint" class="field-hint"></small>
            </div>
          </label>
          <label class="auth-check">
            <input type="checkbox" name="agree" checked required>
            <span>I agree to the <a href="./legal/terms.html" target="_blank" rel="noopener">Terms</a> and <a href="./legal/privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.</span>
          </label>
          <div id="signup-error" class="auth-error" hidden></div>
          <button type="submit" class="btn-primary" id="signup-btn">Create account</button>
        </form>
      </div>

      <p class="auth-alt">
        Already have an account? <a href="./login.html?nodemo=1">Sign in</a>
      </p>
    </section>

    <footer class="auth-foot">
      <span>© 2026 Stationly</span>
      <span>·</span>
      <a href="./legal/terms.html">Terms</a>
      <span>·</span>
      <a href="./legal/privacy.html">Privacy</a>
    </footer>
  </main>

  <script type="module">
    import { supabase, getSession } from './supabaseClient.js';

    const tabMagic = document.getElementById('tab-magic');
    const tabPassword = document.getElementById('tab-password');
    const paneMagic = document.getElementById('pane-magic');
    const panePassword = document.getElementById('pane-password');

    function showPane(which) {
      const isMagic = which === 'magic';
      tabMagic.setAttribute('aria-pressed', String(isMagic));
      tabPassword.setAttribute('aria-pressed', String(!isMagic));
      paneMagic.classList.toggle('active', isMagic);
      panePassword.classList.toggle('active', !isMagic);
      try { localStorage.setItem('stationly_signup_pref', which); } catch(_){}
    }
    tabMagic.addEventListener('click', () => showPane('magic'));
    tabPassword.addEventListener('click', () => showPane('password'));
    // Restore last-used method
    try {
      const pref = localStorage.getItem('stationly_signup_pref');
      if (pref === 'password') showPane('password');
    } catch(_){}

    // Redirect away if already signed in
    (async () => {
      const existing = await getSession();
      if (existing) window.location.href = './onboarding.html';
    })();

    const EMAIL_RX = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    // ─── Magic link signup ─────────────────────────────────────────────────
    const magicForm = document.getElementById('magic-form');
    const magicErr = document.getElementById('magic-error');
    const magicBtn = document.getElementById('magic-btn');
    const magicSent = document.getElementById('magic-sent');
    const magicSentEmail = document.getElementById('magic-sent-email');

    magicForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      magicErr.hidden = true;
      magicErr.textContent = '';

      const fd = new FormData(magicForm);
      const email = (fd.get('email') || '').toString().trim().toLowerCase();
      const fullName = (fd.get('fullName') || '').toString().trim();
      const agreed = !!fd.get('agree');

      if (!EMAIL_RX.test(email)) {
        magicErr.textContent = 'Please enter a valid email address.';
        magicErr.hidden = false;
        return;
      }
      if (!agreed) {
        magicErr.textContent = 'Please accept the Terms and Privacy Policy to continue.';
        magicErr.hidden = false;
        return;
      }

      magicBtn.disabled = true;
      magicBtn.textContent = 'Sending link…';

      const redirectTo = new URL('./verify.html', window.location.href).toString();

      try {
        // signInWithOtp creates a new user if one doesn't exist (shouldCreateUser: true is default)
        const { error } = await supabase.auth.signInWithOtp({
          email,
          options: {
            emailRedirectTo: redirectTo,
            data: fullName ? { full_name: fullName } : {},
          },
        });
        if (error) {
          let msg = error.message || 'Could not send the link. Try again.';
          if (/rate.?limit/i.test(msg)) msg = 'Too many requests. Please wait a minute and try again.';
          magicErr.textContent = msg;
          magicErr.hidden = false;
          magicBtn.disabled = false;
          magicBtn.textContent = 'Email me a sign-in link';
          return;
        }
        // Success — show confirmation, hide form
        magicForm.hidden = true;
        magicSentEmail.textContent = email;
        magicSent.hidden = false;
      } catch (err) {
        magicErr.textContent = err?.message || 'Network error. Try again.';
        magicErr.hidden = false;
        magicBtn.disabled = false;
        magicBtn.textContent = 'Email me a sign-in link';
      }
    });

    // ─── Password signup (fallback) ────────────────────────────────────────
    const form = document.getElementById('signup-form');
    const errBox = document.getElementById('signup-error');
    const btn = document.getElementById('signup-btn');
    const pwInput = document.getElementById('signup-password');
    const pwMeter = document.getElementById('pw-meter');
    const pwFill = document.getElementById('pw-meter-fill');
    const pwHint = document.getElementById('pw-hint');

    function scorePassword(p) {
      let s = 0;
      if (p.length >= 8) s++;
      if (p.length >= 12) s++;
      if (/[A-Z]/.test(p) && /[a-z]/.test(p)) s++;
      if (/[0-9]/.test(p) && /[^A-Za-z0-9]/.test(p)) s++;
      return Math.min(s, 4);
    }

    pwInput.addEventListener('input', () => {
      const v = pwInput.value;
      if (!v) { pwMeter.hidden = true; return; }
      pwMeter.hidden = false;
      const score = scorePassword(v);
      const labels = ['Too weak', 'Weak', 'Okay', 'Strong', 'Very strong'];
      const colors = ['#c9302c', '#c9302c', '#c9831b', '#3b6e3b', '#2e8b57'];
      pwFill.style.width = ((score / 4) * 100) + '%';
      pwFill.style.background = colors[score];
      let msg = labels[score];
      if (v.length < 8) msg = 'At least 8 characters required.';
      pwHint.textContent = msg;
      pwHint.className = 'field-hint ' + (score >= 2 ? 'ok' : 'err');
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.hidden = true;
      errBox.classList.remove('auth-success');

      const fd = new FormData(form);
      const email = (fd.get('email') || '').toString().trim().toLowerCase();
      const password = (fd.get('password') || '').toString();
      const fullName = (fd.get('fullName') || '').toString().trim();
      const agreed = !!fd.get('agree');

      if (!EMAIL_RX.test(email)) {
        errBox.textContent = 'Please enter a valid email address.';
        errBox.hidden = false;
        return;
      }
      if (password.length < 8) {
        errBox.textContent = 'Password must be at least 8 characters.';
        errBox.hidden = false;
        return;
      }
      if (!agreed) {
        errBox.textContent = 'Please accept the Terms and Privacy Policy to continue.';
        errBox.hidden = false;
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creating account…';
      const { data, error } = await supabase.auth.signUp({
        email, password,
        options: {
          data: fullName ? { full_name: fullName } : {},
          emailRedirectTo: new URL('./verify.html', window.location.href).toString(),
        },
      });

      if (error) {
        let msg = error.message || 'Something went wrong. Try again.';
        if (/already registered|user already/i.test(msg)) msg = 'An account with that email already exists. Try signing in instead.';
        else if (/password/i.test(msg) && /pwned|leak/i.test(msg)) msg = 'That password has been seen in a data breach. Please choose another.';
        errBox.textContent = msg;
        errBox.hidden = false;
        btn.disabled = false;
        btn.textContent = 'Create account';
        return;
      }

      if (data.session) {
        window.location.href = './onboarding.html';
      } else {
        errBox.classList.add('auth-success');
        errBox.textContent = 'Check your email to confirm your account, then log in.';
        errBox.hidden = false;
        btn.disabled = false;
        btn.textContent = 'Create account';
      }
    });
  </script>
</body>
</html>
