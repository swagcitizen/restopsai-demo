<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Stationly Staff — Clock in & shift tools</title>
    <meta name="description" content="Employee app for Stationly: clock in, see your shift, check tasks, message your manager." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://esm.sh" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="./styles.css" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Stationly Staff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#faf5ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1a15" media="(prefers-color-scheme: dark)" />
  </head>
  <body class="staff-body">
    <div id="app" class="staff-app">
      <div class="staff-loading" id="loading">
        <div class="staff-logo">S</div>
        <div class="staff-loading-text">Loading…</div>
      </div>
    </div>

    <script type="module" src="./staffApp.js"></script>
    <script>
      // Register service worker scoped to /staff/
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('./sw.js', { scope: '/staff/' })
            .catch((e) => console.warn('SW register failed', e));
        });
      }
    </script>
  </body>
</html>
