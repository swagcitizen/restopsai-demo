<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Stationly</title>
  <link rel="stylesheet" href="auth.css">
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <meta name="description" content="Sign in to Stationly to manage your back-of-house operations." />
  <meta name="theme-color" content="#faf5ea" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1c1a15" media="(prefers-color-scheme: dark)" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Stationly" />
  <meta name="mobile-web-app-capable" content="yes" />
  <script src="/pwa.js" defer></script>
  <script src="https://browser.sentry-cdn.com/8.39.0/bundle.tracing.min.js" crossorigin="anonymous" defer></script>
  <script src="/sentry-init.js" defer></script>
  <style>
    .auth-toggle {
      display:flex; gap:0; margin: 4px 0 20px;
      border:1px solid rgba(255,255,255,.1); border-radius:10px; overflow:hidden;
      background: rgba(255,255,255,.02);
    }
    .auth-toggle button {
      flex:1; padding:11px 12px; border:0; background:transparent; cursor:pointer;
      font: inherit; color: rgba(244,236,216,.65); font-weight:600; font-size:14px;
      transition: background .15s ease, color .15s ease;
    }
    .auth-toggle button[aria-pressed="true"] {
      background: rgba(232,163,61,.12); color: var(--accent, #E8A33D);
      box-shadow: inset 0 -2px 0 var(--accent, #E8A33D);
    }
    .auth-toggle button:hover:not([aria-pressed="true"]) { background: rgba(255,255,255,.04); color: var(--text, #f4ecd8); }
    .pane { display:none; }
    .pane.active { display:block; }
    .magic-success {
      padding: 18px; border-radius: 10px;
      background: rgba(80, 160, 100, .1); border: 1px solid rgba(80, 160, 100, .28);
      color: #b8e0c4; line-height: 1.5;
    }
    .magic-success strong { display:block; margin-bottom:6px; font-size:16px; color: #d4f0d8; }
    .field-hint.muted { opacity:.6 }
    .label-row { display:flex; justify-content:space-between; align-items:baseline; }

    /* Google sign-in button */
    .btn-google {
      width: 100%; display:flex; align-items:center; justify-content:center; gap:10px;
      padding: 12px 16px; border-radius:10px; cursor:pointer;
      background: #ffffff; color: #1f1f1f;
      border: 1px solid rgba(0,0,0,.1);
      font: inherit; font-weight: 600; font-size: 15px;
      transition: background .15s ease, transform .05s ease;
      margin-bottom: 8px;
    }
    .btn-google:hover { background: #f6f6f6; }
    .btn-google:active { transform: translateY(1px); }
    .btn-google:disabled { opacity:.6; cursor:wait; }
    .auth-divider {
      display:flex; align-items:center; gap:12px;
      margin: 16px 0 18px;
      color: rgba(244,236,216,.45); font-size:12px; letter-spacing:.08em; text-transform:uppercase;
    }
    .auth-divider::before, .auth-divider::after {
      content:''; flex:1; height:1px; background: rgba(255,255,255,.08);
    }
  </style>
</head>
<body class="auth-body">
  <main class="auth-shell">
    <header class="auth-head">
      <a href="./app.html" class="brand">
        <svg width="32" height="32" viewBox="0 0 64 64" fill="none" aria-label="Stationly">
          <rect width="64" height="64" rx="14" fill="#e8a33d"/>
          <path d="M20 22 Q20 14 32 14 Q44 14 44 22 L44 24 Q44 28 36 28 L28 28 Q20 28 20 34 Q20 40 28 40 L36 40 Q44 40 44 44 L44 46 Q44 54 32 54 Q20 54 20 46" stroke="#1c1a15" stroke-width="5" stroke-linecap="round" fill="none"/>
        </svg>
        <span>Stationly</span>
      </a>
    </header>

    <section class="auth-card">
      <h1>Sign in</h1>
      <p class="auth-sub">Welcome back. Every restaurant, one system.</p>

      <button type="button" id="google-btn" class="btn-google">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.331C2.438 15.983 5.482 18 9 18z"/>
          <path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.962H.957C.347 6.173 0 7.547 0 9s.348 2.827.957 4.038l3.007-2.331z"/>
          <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.962L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/>
        </svg>
        <span>Continue with Google</span>
      </button>
      <div id="google-error" class="auth-error" hidden></div>
      <div class="auth-divider">or</div>

      <div class="auth-toggle" role="tablist" aria-label="Sign in method">
        <button type="button" id="tab-magic" role="tab" aria-pressed="true" aria-controls="pane-magic">Email me a link</button>
        <button type="button" id="tab-password" role="tab" aria-pressed="false" aria-controls="pane-password">Use password</button>
      </div>

      <!-- Magic link pane (default) -->
      <div class="pane active" id="pane-magic">
        <form id="magic-form" class="auth-form" autocomplete="on" novalidate>
          <label>
            <span>Email</span>
            <input type="email" name="email" id="magic-email" required autocomplete="email" placeholder="you@restaurant.com">
            <small class="field-hint muted">We'll email you a one-tap sign-in link. No password needed.</small>
          </label>
          <div id="magic-error" class="auth-error" hidden></div>
          <button type="submit" class="btn-primary" id="magic-btn">Email me a sign-in link</button>
        </form>

        <div id="magic-sent" class="magic-success" hidden>
          <strong>Check your email.</strong>
          We just sent a sign-in link to <span id="magic-sent-email"></span>. Click it from the same browser. Link expires in 1 hour.
        </div>
      </div>

      <!-- Password pane (fallback) -->
      <div class="pane" id="pane-password">
        <form id="login-form" class="auth-form" autocomplete="on">
          <label>
            <span>Email</span>
            <input type="email" name="email" required autocomplete="email" placeholder="you@restaurant.com">
          </label>
          <label>
            <div class="label-row">
              <span>Password</span>
              <a href="./forgot-password.html" class="auth-inline-link">Forgot?</a>
            </div>
            <input type="password" name="password" required autocomplete="current-password" minlength="8">
          </label>
          <div id="login-error" class="auth-error" hidden></div>
          <button type="submit" class="btn-primary" id="login-btn">Sign in</button>
        </form>
      </div>

      <p class="auth-alt">
        New here? <a href="./signup.html?nodemo=1">Create an account</a>
      </p>
    </section>

    <footer class="auth-foot">
      <span>© 2026 Stationly</span>
      <span>·</span>
      <a href="./legal/terms.html">Terms</a>
      <span>·</span>
      <a href="./legal/privacy.html">Privacy</a>
    </footer>
  </main>

  <script type="module">
    import { supabase, getSession } from './supabaseClient.js';
    import { disableDemoForSession } from './demoMode.js';

    // ─── Google OAuth sign-in ──────────────────────────────────────────────
    const googleBtn = document.getElementById('google-btn');
    const googleErr = document.getElementById('google-error');
    googleBtn.addEventListener('click', async () => {
      googleErr.hidden = true; googleErr.textContent = '';
      googleBtn.disabled = true;
      try { localStorage.setItem('stationly_login_pref', 'google'); } catch(_){}
      try { disableDemoForSession(); } catch(_){}
      const redirectTo = new URL('./verify.html', window.location.href).toString();
      const { error } = await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo, queryParams: { access_type: 'offline', prompt: 'select_account' } },
      });
      if (error) {
        googleErr.textContent = error.message || 'Google sign-in failed. Try again.';
        googleErr.hidden = false;
        googleBtn.disabled = false;
      }
    });

    const tabMagic = document.getElementById('tab-magic');
    const tabPassword = document.getElementById('tab-password');
    const paneMagic = document.getElementById('pane-magic');
    const panePassword = document.getElementById('pane-password');

    function showPane(which) {
      const isMagic = which === 'magic';
      tabMagic.setAttribute('aria-pressed', String(isMagic));
      tabPassword.setAttribute('aria-pressed', String(!isMagic));
      paneMagic.classList.toggle('active', isMagic);
      panePassword.classList.toggle('active', !isMagic);
      try { localStorage.setItem('stationly_login_pref', which); } catch(_){}
    }
    tabMagic.addEventListener('click', () => showPane('magic'));
    tabPassword.addEventListener('click', () => showPane('password'));
    try {
      const pref = localStorage.getItem('stationly_login_pref');
      if (pref === 'password') showPane('password');
    } catch(_){}

    const EMAIL_RX = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    // ─── Where should a signed-in user go? ────────────────────────────────
    async function destinationFor(userId) {
      try {
        const { data } = await supabase.from('profiles').select('is_platform_owner').eq('id', userId).maybeSingle();
        if (data?.is_platform_owner) return './platform.html';
      } catch (_) {}
      try {
        const { data: m } = await supabase.from('memberships').select('tenant_id').limit(1);
        if (!m || m.length === 0) return './onboarding.html';
      } catch (_) {}
      return './app.html';
    }

    // ─── Magic link login ─────────────────────────────────────────────────
    const magicForm = document.getElementById('magic-form');
    const magicErr = document.getElementById('magic-error');
    const magicBtn = document.getElementById('magic-btn');
    const magicSent = document.getElementById('magic-sent');
    const magicSentEmail = document.getElementById('magic-sent-email');

    magicForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      magicErr.hidden = true;

      const fd = new FormData(magicForm);
      const email = (fd.get('email') || '').toString().trim().toLowerCase();
      if (!EMAIL_RX.test(email)) {
        magicErr.textContent = 'Please enter a valid email address.';
        magicErr.hidden = false;
        return;
      }

      magicBtn.disabled = true;
      magicBtn.textContent = 'Sending link…';

      try {
        // For login: shouldCreateUser:false so unknown emails don't silently create accounts.
        // Restaurants who haven't signed up will see a clear "no account found" error and
        // be nudged to sign up instead.
        const { error } = await supabase.auth.signInWithOtp({
          email,
          options: {
            emailRedirectTo: new URL('./verify.html', window.location.href).toString(),
            shouldCreateUser: false,
          },
        });
        if (error) {
          let msg = error.message || 'Could not send the link. Try again.';
          if (/signups not allowed|user not found|no.*user/i.test(msg)) {
            msg = 'No Stationly account found for that email. Try signing up first.';
          } else if (/rate.?limit/i.test(msg)) {
            msg = 'Too many requests. Please wait a minute and try again.';
          }
          magicErr.textContent = msg;
          magicErr.hidden = false;
          magicBtn.disabled = false;
          magicBtn.textContent = 'Email me a sign-in link';
          return;
        }
        magicForm.hidden = true;
        magicSentEmail.textContent = email;
        magicSent.hidden = false;
      } catch (err) {
        magicErr.textContent = err?.message || 'Network error. Try again.';
        magicErr.hidden = false;
        magicBtn.disabled = false;
        magicBtn.textContent = 'Email me a sign-in link';
      }
    });

    // ─── Password login (fallback) ────────────────────────────────────────
    const form = document.getElementById('login-form');
    const errBox = document.getElementById('login-error');
    const btn = document.getElementById('login-btn');

    function showError(msg) { errBox.textContent = msg; errBox.hidden = false; }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.hidden = true; errBox.textContent = '';
      btn.disabled = true; btn.textContent = 'Signing in…';
      const fd = new FormData(form);
      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email: (fd.get('email') || '').toString().trim().toLowerCase(),
          password: fd.get('password'),
        });
        if (error) {
          showError(error.message || 'Could not sign in. Check your email and password.');
          btn.disabled = false; btn.textContent = 'Sign in';
          return;
        }
        window.location.href = await destinationFor(data.user.id);
      } catch (err) {
        showError(err?.message || 'Network error. Try again.');
        btn.disabled = false; btn.textContent = 'Sign in';
      }
    });

    // Visiting /login.html means the user wants to sign in with real creds —
    // so disable demo auto-promote for this browser session.
    disableDemoForSession();

    // If a stale demo session is sitting in localStorage, sign it out.
    (async () => {
      const params = new URLSearchParams(window.location.search);
      const forceLogin = params.get('force') === '1';
      const existing = await getSession();
      if (existing?.user?.email === 'demo@bellavita.app' || forceLogin) {
        await supabase.auth.signOut();
      } else if (existing?.user?.id) {
        window.location.href = await destinationFor(existing.user.id);
      }
    })();
  </script>
</body>
</html>
